<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>imgLop lab: speed test</title>
<style>
body{font:16px -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee;max-width:640px;margin:auto}
h1{font-size:20px;margin:0 0 4px} p{color:#aaa;font-size:14px;line-height:1.4}
button,label.b{display:block;width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border-radius:12px;border:0;background:#f43f5e;color:#fff;font-size:16px;font-weight:600;text-align:center}
button:disabled{opacity:.4} button.g{background:#333}
#log{white-space:pre-wrap;font:13px ui-monospace,Menlo,monospace;background:#1c1c1e;border-radius:10px;padding:10px;min-height:80px}
#out{width:100%;border-radius:10px;margin-top:10px;background:repeating-conic-gradient(#555 0 25%,#333 0 50%) 50%/20px 20px}
#warn{background:#7c2d12;border-radius:10px;padding:10px;display:none;margin:10px 0}
</style></head><body style="background:#111;color:#eee;font-family:-apple-system,system-ui,sans-serif">
<noscript><p style="color:#fff;padding:16px">JavaScript is turned off in this browser, so the test cannot run.</p></noscript>
<div id="err" style="display:none;padding:10px 16px;background:#7c2d12;color:#fff;white-space:pre-wrap"></div>
<script>window.addEventListener("error",function(e){var x=document.getElementById("err");x.style.display="block";x.textContent+="Error: "+(e.message||e.type)+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"")+"\n";},true);</script>
<h1>imgLop lab: speed test</h1>
<p>Internal speed test. Everything runs on your device and no photo is uploaded.</p>
<div id="warn"></div>
<label class="b g" for="f">1. Choose a photo</label><input id="f" type="file" accept="image/*" hidden>
<p id="fi">No photo chosen.</p>
<button id="r1" disabled>2a. Run FAST model (current, 4.7 MB)</button>
<button id="r2" disabled>2b. Run BEST QUALITY model (46.7 MB download)</button>
<button id="cp" class="g">Show my results report</button>
<div id="log"></div>
<img id="out" alt="">
<script src="./vendor/ort/ort.min.js"></script>
<script>
const $=s=>document.querySelector(s), logEl=$('#log'), T=[];
const log=t=>{logEl.textContent+=t+'\n'};
let photo=null;
// detect a previous run that never finished (Safari reloaded the tab = out of memory)
try{ if(sessionStorage.getItem('lab_running')){ const w=$('#warn'); w.style.display='block'; w.textContent='The page reloaded during the last run: "'+sessionStorage.getItem('lab_running')+'". That usually means Safari ran out of memory. Please report this to the site owner.'; log('LAST RUN DID NOT FINISH: '+sessionStorage.getItem('lab_running')); sessionStorage.removeItem('lab_running'); } }catch(e){}
log('Phone: '+navigator.userAgent);
log('crossOriginIsolated: '+self.crossOriginIsolated+' | cores: '+(navigator.hardwareConcurrency||'?'));
$('#f').onchange=async e=>{ photo=e.target.files[0]; if(!photo)return; $('#fi').textContent=photo.name+' ('+(photo.size/1048576).toFixed(1)+' MB)'; $('#r1').disabled=$('#r2').disabled=false; };
const MODELS={
  fast:{name:'FAST u2netp',S:320,mean:[.485,.456,.406],std:[.229,.224,.225],parts:['./models/u2netp.onnx']},
  best:{name:'BEST isnet (compressed)',S:1024,mean:[.5,.5,.5],std:[1,1,1],parts:[1,2,3,4].map(i=>'./isnet-w8.part'+i)}
};
async function load(m,key){
  let cache=null,buf=null; const ck='lab-'+key;
  try{cache=await caches.open('imglop-lab-v1'); const hit=await cache.match(ck); if(hit){ buf=new Uint8Array(await hit.arrayBuffer()); return {buf,cached:true}; } }catch(e){}
  const chunks=[]; let got=0;
  for(const u of m.parts){ const r=await fetch(u); if(!r.ok) throw new Error('Missing file '+u+' (HTTP '+r.status+')'); const b=new Uint8Array(await r.arrayBuffer()); chunks.push(b); got+=b.length; log('  downloaded '+(got/1048576).toFixed(1)+' MB'); }
  buf=new Uint8Array(got); let o=0; for(const c of chunks){buf.set(c,o); o+=c.length;}
  try{ if(cache) await cache.put(ck,new Response(buf)); }catch(e){}
  return {buf,cached:false};
}
async function run(key){
  const m=MODELS[key]; $('#r1').disabled=$('#r2').disabled=true; $('#out').removeAttribute('src');
  sessionStorage.setItem('lab_running',m.name);
  const rec={model:m.name}; const t0=performance.now();
  try{
    log('\n== '+m.name+' =='); log('Loading model…');
    let t=performance.now(); const {buf,cached}=await load(m,key); rec.load_s=((performance.now()-t)/1000).toFixed(1); rec.from_cache=cached; log('Model ready in '+rec.load_s+' s'+(cached?' (from cache)':' (downloaded)'));
    ort.env.wasm.wasmPaths=new URL('./vendor/ort/',location.href).href; if(!self.crossOriginIsolated) ort.env.wasm.numThreads=1;
    t=performance.now(); const sess=await ort.InferenceSession.create(buf,{executionProviders:['wasm'],graphOptimizationLevel:'all'}); rec.create_s=((performance.now()-t)/1000).toFixed(1); log('Engine started in '+rec.create_s+' s');
    const bm=await createImageBitmap(photo); const sc=Math.min(1,2000/Math.max(bm.width,bm.height)); const W=Math.round(bm.width*sc),H=Math.round(bm.height*sc);
    const S=m.S,c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d',{willReadFrequently:true});
    const fit=S/Math.max(bm.width,bm.height),pw=Math.round(bm.width*fit),ph=Math.round(bm.height*fit),ox=Math.floor((S-pw)/2),oy=Math.floor((S-ph)/2);
    x.fillStyle='#000';x.fillRect(0,0,S,S);x.drawImage(bm,ox,oy,pw,ph); const d=x.getImageData(0,0,S,S).data,A=S*S,inp=new Float32Array(3*A);
    let mx=1; for(let i=0;i<A;i++){const j=i*4; if(d[j]>mx)mx=d[j]; if(d[j+1]>mx)mx=d[j+1]; if(d[j+2]>mx)mx=d[j+2];}
    for(let i=0;i<A;i++){const j=i*4; for(let k=0;k<3;k++) inp[k*A+i]=(d[j+k]/mx-m.mean[k])/m.std[k];}
    log('Thinking… (the screen may look frozen; keep this page open)'); await new Promise(r=>setTimeout(r,60));
    t=performance.now(); const out=await sess.run({[sess.inputNames[0]]:new ort.Tensor('float32',inp,[1,3,S,S])}); rec.think_s=((performance.now()-t)/1000).toFixed(1); log('Thinking took '+rec.think_s+' s');
    const p=out[sess.outputNames[0]].data; let mn=1e9,mxp=-1e9; for(const v of p){if(v<mn)mn=v; if(v>mxp)mxp=v;}
    const mc=document.createElement('canvas'); mc.width=mc.height=S; const mcx=mc.getContext('2d'),mi=mcx.createImageData(S,S);
    for(let i=0;i<A;i++) mi.data[i*4+3]=Math.round((p[i]-mn)/((mxp-mn)||1)*255); mcx.putImageData(mi,0,0);
    const f=document.createElement('canvas'); f.width=W;f.height=H; const fx=f.getContext('2d',{willReadFrequently:true}); fx.imageSmoothingQuality='high'; fx.drawImage(mc,ox,oy,pw,ph,0,0,W,H);
    const ma=fx.getImageData(0,0,W,H).data; fx.clearRect(0,0,W,H); fx.drawImage(bm,0,0,W,H); const id=fx.getImageData(0,0,W,H); for(let i=3;i<id.data.length;i+=4) id.data[i]=Math.round(id.data[i]*ma[i]/255); fx.putImageData(id,0,0);
    $('#out').src=f.toDataURL('image/png'); rec.total_s=((performance.now()-t0)/1000).toFixed(1); rec.ok=true; log('DONE in '+rec.total_s+' s total. Result shown below.');
  }catch(e){ rec.ok=false; rec.error=String(e).slice(0,200); log('FAILED: '+rec.error); }
  sessionStorage.removeItem('lab_running'); T.push(rec); $('#r1').disabled=$('#r2').disabled=false;
}
$('#r1').onclick=()=>run('fast'); $('#r2').onclick=()=>run('best');
$('#cp').onclick=()=>{ log('\n===== REPORT (screenshot this or copy it) =====\n'+JSON.stringify(T,null,1)); };
</script></body></html>
